<h1 class="dialog-header">{{ data.name }}</h1>
<div class="dialog-content">
  <p>{{ data.summary }}</p>
</div>
<div class="dialog-actions">
  <button class="close-button" mat-button mat-dialog-close>Close</button>
  <button class="favorite-button" [disabled]="isDisabled" mat-button (click)="addToFavorites(data.name, data.businessId)">{{ favoritesText }}</button>
</div>
